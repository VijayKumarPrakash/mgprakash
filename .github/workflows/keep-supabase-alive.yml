name: Prevent Supabase Pausing

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  ping-db:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API and log response
        run: |
          echo "Sending keepalive write to Supabase..."

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$NOW\"}")

          echo "HTTP Status Code: $STATUS_CODE"

          # Check if the status code is a success (204 = updated, no content returned)
          if [ "$STATUS_CODE" -eq 204 ]; then
            echo "✅ Success! Keepalive row updated at $NOW."
          else
            echo "⚠️ Warning: Received unexpected status code $STATUS_CODE. Check your credentials or RLS policy."
            exit 1
          fi